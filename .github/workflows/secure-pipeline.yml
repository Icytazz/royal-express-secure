name: Secure Pipeline

# Tools mapped to pipeline phase (report section 8.1):
#   commit / PR   Semgrep            SAST  - injection, weak crypto, missing guards
#   commit / PR   Dependency-Check   SCA   - known CVEs in bundled JS libraries
#   commit / PR   Gitleaks           secret scanning - connection credentials
#   post-deploy   OWASP ZAP          DAST  - against a live instance built in CI
#   scheduled     Dependency-Check   weekly re-run catches newly published CVEs

on:
  push:
    branches: [ main, secure-fixes, baseline ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'          # Mondays 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write         # required to upload SARIF

jobs:

  # ------------------------------------------------------------------ SAST
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      # Registry rulesets for generic coverage, plus the custom rules written
      # for the three vulnerabilities identified in Part 1.
      # `|| true` so the scan always produces a report; the gate decides pass/fail.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/php \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config ./.semgrep/ \
            --json  -o semgrep-results.json \
            --sarif -o semgrep.sarif \
            --metrics=off || true

      - name: Publish SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-semgrep-report
          path: |
            semgrep-results.json
            semgrep.sarif

      - name: Quality gate
        run: python .github/scripts/gate.py

  # ------------------------------------------------------------------- SCA
  sca:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    continue-on-error: true      # NVD feed download is slow and occasionally rate-limited
    steps:
      - uses: actions/checkout@v4

      - name: Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: royal-express-cms
          path: '.'
          format: 'HTML'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-dependency-check-report
          path: reports/

  # --------------------------------------------------------------- secrets
  secrets:
    name: Secret scanning - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0         # full history: a credential removed later is still in it

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------ DAST
  dast:
    name: DAST - OWASP ZAP baseline
    runs-on: ubuntu-latest
    needs: sast
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: royal_express_db
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli

      - name: Import schema
        run: mysql -h 127.0.0.1 -u root -proot royal_express_db < Database/royal_express_db.sql

      # Credentials come from the environment, which is what makes the app
      # runnable in CI at all - hardcoded localhost/root would fail here.
      - name: Start application
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
          DB_NAME: royal_express_db
          LOG_DIR: /tmp/cms-logs
        run: |
          mkdir -p /tmp/cms-logs
          php -S 0.0.0.0:8080 -t . &
          sleep 5
          curl -sI http://127.0.0.1:8080/index.php | head -1

      # ZAP runs inside Docker, so 127.0.0.1 is the container. PHP is bound to
      # 0.0.0.0 and the target is the Docker bridge address.
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://172.17.0.1:8080'
          cmd_options: '-a'
          allow_issue_writing: false
